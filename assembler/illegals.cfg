# Representative names for duplicate unofficial opcode families.
# The exact-byte opXX forms remain available for alternate encodings.
NOP  imm  $80
NOP  zp   $04
NOP  zpx  $14
NOP  abs  $0C
NOP  absx $1C
KIL  imp  $02
JAM  imp  $12
HLT  imp  $22

# Additional established aliases kept disabled until imported source needs them.
# These spellings occur in older VICE/64tass/DASM-era opcode tables and in
# NESdev-style unofficial-opcode references.  Uncommenting them would not add
# encodings; each line is only another mnemonic for an opcode already named
# above.  Notes call out ambiguity, instability, or a current-name collision.

# AAC is an older name for ANC.  No mnemonic conflict, but like ANC this table
# can name only one of the duplicate immediate encodings; $2B remains op2B.
# AAC  imm  $0B

# AAX is an older name for SAX.  No current VCSC mnemonic conflict.
# AAX  zp   $87
# AAX  zpy  $97
# AAX  abs  $8F
# AAX  indx $83

# ASO is an older name for SLO.  No current VCSC mnemonic conflict.
# ASO  zp   $07
# ASO  zpx  $17
# ASO  abs  $0F
# ASO  absx $1F
# ASO  absy $1B
# ASO  indx $03
# ASO  indy $13

# DCM is an older name for DCP.  No current VCSC mnemonic conflict.
# DCM  zp   $C7
# DCM  zpx  $D7
# DCM  abs  $CF
# DCM  absx $DF
# DCM  absy $DB
# DCM  indx $C3
# DCM  indy $D3

# ISB and INS are alternate names for ISC.  Neither conflicts with a current
# VCSC mnemonic; enabling both would create three accepted spellings.
# ISB  zp   $E7
# ISB  zpx  $F7
# ISB  abs  $EF
# ISB  absx $FF
# ISB  absy $FB
# ISB  indx $E3
# ISB  indy $F3
# INS  zp   $E7
# INS  zpx  $F7
# INS  abs  $EF
# INS  absx $FF
# INS  absy $FB
# INS  indx $E3
# INS  indy $F3

# LAR is an alternate name for LAS.  The opcode is unstable on NMOS parts but
# the spelling has no current VCSC mnemonic conflict.
# LAR  absy $BB

# LSE is an older name for SRE.  No current VCSC mnemonic conflict.
# LSE  zp   $47
# LSE  zpx  $57
# LSE  abs  $4F
# LSE  absx $5F
# LSE  absy $5B
# LSE  indx $43
# LSE  indy $53

# SHA and AXA are alternate names for AHX.  These encodings are unstable; the
# names do not conflict with current VCSC mnemonics, but accepting both would
# create three spellings for the same operation.
# SHA  absy $9F
# SHA  indy $93
# AXA  absy $9F
# AXA  indy $93

# SHS is an alternate name for TAS.  It is unstable and has no current VCSC
# mnemonic conflict.
# SHS  absy $9B

# SXA is an alternate name for SHX.  It is unstable and has no current VCSC
# mnemonic conflict.
# SXA  absy $9E

# SYA and SAY are alternate names for SHY.  The opcode is unstable; neither
# spelling conflicts with a current VCSC mnemonic.
# SYA  absx $9C
# SAY  absx $9C

# ANE is an alternate name for XAA.  The immediate opcode is highly unstable;
# the spelling has no current VCSC mnemonic conflict.
# ANE  imm  $8B
