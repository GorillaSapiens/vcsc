# raw opXX remains available for encodings not named here

LAX  imm  $AB
LAX  zp   $A7
LAX  zpy  $B7
LAX  abs  $AF
LAX  absy $BF
LAX  indx $A3
LAX  indy $B3
SAX  zp   $87
SAX  zpy  $97
SAX  abs  $8F
SAX  indx $83
DCP  zp   $C7
DCP  zpx  $D7
DCP  abs  $CF
DCP  absx $DF
DCP  absy $DB
DCP  indx $C3
DCP  indy $D3
ISC  zp   $E7
ISC  zpx  $F7
ISC  abs  $EF
ISC  absx $FF
ISC  absy $FB
ISC  indx $E3
ISC  indy $F3
SLO  zp   $07
