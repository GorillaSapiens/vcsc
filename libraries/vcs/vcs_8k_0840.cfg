# Simulator-only mapping for Atari 0840 / EconoBanking.
# Physical bank 0 powers up.  Reads or writes in the decoded $0800/$0840
# below-cartridge selector families choose physical banks 0 and 1 respectively;
# vcsc-sim preserves the underlying console-device access for writes.
CARTRIDGE {
    mapper = 0840;
    fillval = $FF;
    trampoline = $0F00;
    trampolinesize = $00E0;
    vectorbridge = $0FE0;
}
BANKS {
    BANK0: start = $F000, size = $1000, hotspot = $0800, fileindex = 0, startup = yes;
    BANK1: start = $D000, size = $1000, hotspot = $0840, fileindex = 1, startup = no;
}
MEMORY {
    RAM:   start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph;
    bank1: start = $D000, size = $0F00, type = ro, define = yes, bank = BANK1;
    bank0: start = $F000, size = $0F00, type = ro, define = yes, bank = BANK0;
}
