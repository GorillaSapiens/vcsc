# Wickstead Design 8K / 64-byte RAM simulator mapping. Reads of TIA $30-$3F
# select one of eight four-segment arrangements after the hardware delay.
CARTRIDGE {
    mapper = WD;
}
BANKS {
    BANK0: start = $1000, size = $0400, fileindex = 0, startup = no;
    BANK1: start = $3400, size = $0400, fileindex = 1, startup = no;
    BANK2: start = $5800, size = $0400, fileindex = 2, startup = no;
    BANK3: start = $FC00, size = $0400, fileindex = 3, startup = yes;
    BANK4: start = $7400, size = $0400, fileindex = 4, startup = no;
    BANK5: start = $9C00, size = $0400, fileindex = 5, startup = no;
    BANK6: start = $B800, size = $0400, fileindex = 6, startup = no;
    BANK7: start = $D000, size = $0400, fileindex = 7, startup = no;
}
MEMORY {
    RAM: start = $0080, size = $0080, type = rw, define = yes;
    cartram: read_start = $F000, write_start = $F040, size = $0040, type = rw, define = yes;
}
