# Minimal unbanked 4K NTSC standard-kernel linker configuration.
#
# The included kernel module uses ordinary RIOT-RAM allocation. The only extra
# physical placement rule beyond vcs_4k.cfg is four supplementary top-of-RAM
# bytes. The exported drawscreen -> overscan-hook call edge is visible to the
# whole-program call graph; these four bytes cover the deeper internal mask-prep
# JSR chain that remains hidden inside the normalized assembly.

MEMORY {
    RAM:      start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph, callstack_extra = $0004;
    ROM:      start = $F000, size = $0FFA, file = %O, fill = yes, fillval = $FF, define = yes;
    VECTORS:  start = $FFFA, size = $0006, file = %O, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = RAM,     type = zp,   define = yes;
    DATA:     load = ROM, run = RAM,     type = data, define = yes;
    BSS:      load = RAM,     type = bss,  define = yes;
    STARTUP:  load = ROM,     type = ro,   define = yes;
    CODE:           load = ROM, type = ro, define = yes;
    RODATA:         load = ROM, type = ro, define = yes;
    KERNEL_CODE:    load = ROM, type = ro, define = yes, align = $0100;
    KERNEL_RODATA:  load = ROM, type = ro, define = yes, align = $0100;
    VECTORS:  load = VECTORS, type = ro,   start = $FFFA;
}
