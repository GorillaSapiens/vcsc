# OmniCart PHM 32K direct-addressing simulator configuration.
#
# OMNI has no selector state: each 4K file chunk maps directly to its recovered
# logical 6507 address.  The $1000 island is same-address cartridge RAM; the
# remaining seven islands are read-only program/constant storage.  BANK0 at
# $F000 is only the reset/startup home, not a switched bank.

CARTRIDGE {
    mapper = OMNI;
    fillval = $FF;
}

BANKS {
    BANK7: start = $1000, size = $1000, startup = no;
    BANK6: start = $3000, size = $1000, startup = no;
    BANK5: start = $5000, size = $1000, startup = no;
    BANK4: start = $7000, size = $1000, startup = no;
    BANK3: start = $9000, size = $1000, startup = no;
    BANK2: start = $B000, size = $1000, startup = no;
    BANK1: start = $D000, size = $1000, startup = no;
    BANK0: start = $F000, size = $1000, startup = yes;
}

MEMORY {
    ram:     start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph;
    cartram: start = $1000, size = $1000, type = rw, define = yes;
    bank6:   start = $3000, size = $1000, type = ro, define = yes, bank = BANK6;
    bank5:   start = $5000, size = $1000, type = ro, define = yes, bank = BANK5;
    bank4:   start = $7000, size = $1000, type = ro, define = yes, bank = BANK4;
    bank3:   start = $9000, size = $1000, type = ro, define = yes, bank = BANK3;
    bank2:   start = $B000, size = $1000, type = ro, define = yes, bank = BANK2;
    bank1:   start = $D000, size = $1000, type = ro, define = yes, bank = BANK1;
    bank0:   start = $F000, size = $0FF8, type = ro, define = yes, bank = BANK0;
    VECTORS: start = $FFFA, size = $0006, type = ro, define = yes, bank = BANK0;
}
