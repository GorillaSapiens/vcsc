# Simulator-only mapping for UA Limited 8K bankswitching.
# Physical bank 0 powers up.  The decoded $0220 family selects file bank 0 and
# the $0240 family selects file bank 1.  Reads/writes preserve the underlying
# console-device access because the selector hardware overlays low memory.
CARTRIDGE {
    mapper = UA;
    fillval = $FF;
    trampoline = $0F00;
    trampolinesize = $00E0;
    vectorbridge = $0FE0;
}
BANKS {
    BANK0: start = $F000, size = $1000, hotspot = $0220, fileindex = 0, startup = yes;
    BANK1: start = $D000, size = $1000, hotspot = $0240, fileindex = 1, startup = no;
}
MEMORY {
    RAM:   start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph;
    bank1: start = $D000, size = $0F00, type = ro, define = yes, bank = BANK1;
    bank0: start = $F000, size = $0F00, type = ro, define = yes, bank = BANK0;
}
