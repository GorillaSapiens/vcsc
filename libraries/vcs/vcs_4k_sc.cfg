# Atari 2600 / VCS 4KSC Superchip logical-memory configuration.
#
# The authoritative flat cartridge topology is libraries/vcs/vcs_4k_sc.c26.
# This retained cfg supplies the simulator/legacy logical map: the first $100
# cartridge bytes are hidden by the Superchip RAM ports, ROM is visible at
# $F100-$FFFF. $FFF8-$FFFB carries the final-bank 4KSC signature; its last
# two bytes replace the unused NMI vector while RESET/IRQ remain $FFFC-$FFFF.

MEMORY {
    RAM:       start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph;
    superchip: read_start = $F080, write_start = $F000, size = $0080, type = rw, define = yes;
    ROM:       start = $F100, size = $0EF8, type = ro, define = yes;
    VECTORS:   start = $FFFA, size = $0006, type = ro, define = yes;
}

SEGMENTS {
    ZEROPAGE:       load = ROM, run = RAM, type = zp,   define = yes;
    DATA:           load = ROM, run = RAM, type = data, define = yes;
    BSS:            load = RAM,            type = bss,  define = yes;
    STARTUP:        load = ROM,            type = ro,   define = yes;
    CODE:           load = ROM,            type = ro,   define = yes;
    RODATA:         load = ROM,            type = ro,   define = yes;
    BSS.superchip:  load = superchip,      type = bss,  define = yes;
    DATA.superchip: load = ROM, run = superchip, type = data, define = yes;
    VECTORS:        load = VECTORS,        type = ro,   start = $FFFA;
}
