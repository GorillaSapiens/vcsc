# Atari 2600 / VCS 8K F8SC Superchip bank-switched cartridge linker configuration.
#
# VCSC logical BANK0 is the $F000-$FFFF home/startup bank and is written last
# in the cartridge image.  Logical BANK1 is the $D000-$DFFF bank and is written
# first.  The F8 mapper numbers physical file chunks in the opposite direction:
# $1FF8 selects file chunk 0 / VCSC BANK1, while $1FF9 selects file chunk 1 /
# VCSC BANK0.
#
# Superchip RAM uses the mirrored $x000-$x07F write window and
# $x080-$x0FF read window.  Ordinary ROM allocation therefore begins at
# $x100 and ends at $xEFF in every bank.  The emitted image still contains
# complete 4K physical banks; the reserved 256-byte prefix is filled but is
# decoded as shared cartridge RAM ports by F8SC/F6SC/F4SC hardware.
#
# The common trampoline table occupies $xF00-$xFDF, the identical vector
# bridge occupies $xFE0-$xFF1, $xFF2-$xFF9 remains reserved, and vectors
# occupy $xFFA-$xFFF.

CARTRIDGE {
    mapper = F8SC;
    fillval = $FF;
    trampoline = $0F00;
    trampolinesize = $00E0;
    vectorbridge = $0FE0;
}

BANKS {
    BANK0: start = $F000, size = $1000, hotspot = $1FF9, startup = yes;
    BANK1: start = $D000, size = $1000, hotspot = $1FF8, startup = no;
}

MEMORY {
    RAM:                  start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph;
    superchip:       read_start = $F080, write_start = $F000, size = $0080, type = rw, define = yes;

    bank1                : start = $D100, size = $0E00, type = ro, define = yes, bank = BANK1;
    BANK1_TRAMPOLINE:     start = $DF00, size = $00E0,                         bank = BANK1;
    BANK1_VECTOR_BRIDGE:  start = $DFE0, size = $0012,                         bank = BANK1;
    BANK1_TAIL:           start = $DFF2, size = $0008,                         bank = BANK1;
    BANK1_VECTORS:        start = $DFFA, size = $0006,                         bank = BANK1;

    bank0                : start = $F100, size = $0E00, type = ro, define = yes, bank = BANK0;
    BANK0_TRAMPOLINE:     start = $FF00, size = $00E0,                         bank = BANK0;
    BANK0_VECTOR_BRIDGE:  start = $FFE0, size = $0012,                         bank = BANK0;
    BANK0_TAIL:           start = $FFF2, size = $0008,                         bank = BANK0;
    BANK0_VECTORS:        start = $FFFA, size = $0006,                         bank = BANK0;
}

SEGMENTS {
    ZEROPAGE:     load = bank0, run = RAM, type = zp,   define = yes;
    DATA:         load = bank0, run = RAM, type = data, define = yes;
    BSS:          load = RAM,               type = bss,  define = yes;
    STARTUP:      load = bank0,              type = ro,   define = yes;
    CODE:         load = bank0,              type = ro,   define = yes;
    CODE.bank0:   load = bank0,              type = ro,   define = yes;
    CODE.bank1:   load = bank1,              type = ro,   define = yes;
    RODATA:       load = bank0,              type = ro,   define = yes;
    RODATA.bank0: load = bank0,              type = ro,   define = yes;
    RODATA.bank1: load = bank1,              type = ro,   define = yes;
    VECTORS:      load = BANK0_VECTORS,      type = ro,   start = $FFFA;
}
