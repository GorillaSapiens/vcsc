# Unbanked 4K NTSC per-row player-color standard-renderer configuration.
#
# The profile retains the legal ball-mask preparation helper and one hidden
# assembly JSR level, so four supplementary top-of-RAM bytes remain explicit.
# P0/P1 color tables replace M0/M1 in the visible schedule.

MEMORY {
    RAM:      start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph, callstack_extra = $0004;
    ROM:      start = $F000, size = $0FFA, file = %O, fill = yes, fillval = $FF, define = yes;
    VECTORS:  start = $FFFA, size = $0006, file = %O, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = RAM,     type = zp,   define = yes;
    DATA:     load = ROM, run = RAM,     type = data, define = yes;
    BSS:      load = RAM,     type = bss,  define = yes;
    STARTUP:  load = ROM,     type = ro,   define = yes;
    CODE:           load = ROM, type = ro, define = yes;
    RODATA:         load = ROM, type = ro, define = yes;
    RENDERER_CODE:    load = ROM, type = ro, define = yes;
    RENDERER_RODATA:  load = ROM, type = ro, define = yes, align = $0100;
    VECTORS:  load = VECTORS, type = ro,   start = $FFFA;
}
