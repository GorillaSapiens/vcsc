# Deprecated compatibility configuration for the unbanked 4K NTSC standard
# renderer.  The renderer object's .segmentregion, .segmentalign,
# .segmentprivate, .pagecontain/.indexrange, and .callstackextra metadata now
# owns every component-specific placement and hidden-stack requirement.
#
# New builds use the ordinary installed 4K C26 profile and vcs.cfg (or simply
# the driver's default 4K selection).  This file remains installed so old build
# commands continue to work, but it contains only generic 4K allocator/output
# policy and no renderer-specific segment or stack contract.

MEMORY {
    RAM:      start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph;
    ROM:      start = $F000, size = $0FFA, file = %O, fill = yes, fillval = $FF, define = yes;
    VECTORS:  start = $FFFA, size = $0006, file = %O, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = RAM,     type = zp,   define = yes;
    DATA:     load = ROM, run = RAM,     type = data, define = yes;
    BSS:      load = RAM,     type = bss,  define = yes;
    STARTUP:  load = ROM,     type = ro,   define = yes;
    CODE:           load = ROM, type = ro, define = yes;
    RODATA:         load = ROM, type = ro, define = yes;
    VECTORS:  load = VECTORS, type = ro,   start = $FFFA;
}
