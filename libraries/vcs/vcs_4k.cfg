# Atari 2600 / VCS 4K cartridge linker configuration.
#
# This models the conventional unbanked 4K cartridge layout at $F000-$FFFF.
# The VCS has one 128-byte RIOT RAM block at $80-$FF.  Page-1 addresses
# $0180-$01FF are only a mirror of those same bytes, not additional RAM.
#
# For now, the linker allocates static storage and the transitional N software
# stack from $80-$DF.  The upper 32 physical bytes, $E0-$FF (mirrored at
# $01E0-$01FF), are deliberately left unallocated for JSR/RTS return addresses
# and occasional PHA/PHP use by the 6502 hardware stack.

MEMORY {
    RAM:      start = $0080, size = $0060, type = rw, define = yes;
    ROM:      start = $F000, size = $0FFA, file = %O, fill = yes, fillval = $FF, define = yes;
    VECTORS:  start = $FFFA, size = $0006, file = %O, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = RAM,     type = zp,   define = yes;
    DATA:     load = ROM, run = RAM,     type = data, define = yes;
    BSS:      load = RAM,     type = bss,  define = yes;
    ARGSTACK: load = RAM,     type = bss,  define = yes;
    STARTUP:  load = ROM,     type = ro,   define = yes;
    CODE:     load = ROM,     type = ro,   define = yes;
    RODATA:   load = ROM,     type = ro,   define = yes;
    VECTORS:  load = VECTORS, type = ro,   start = $FFFA;
}
