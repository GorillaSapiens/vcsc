# CBS FA / RAM Plus 12K compatibility/simulator configuration.
# Physical file chunks 0/1/2 are selected by $1FF8/$1FF9/$1FFA. The final
# chunk is the power-on/startup bank. Cartridge RAM writes at $1000-$10FF and
# reads at $1100-$11FF in the 13-bit hardware view; the $Fxxx aliases below are
# the linker's canonical 16-bit mirrors.

CARTRIDGE {
    mapper = FA;
    fillval = $FF;
    trampoline = $0F00;
    trampolinesize = $00E0;
    vectorbridge = $0FE0;
}

BANKS {
    BANK0: start = $F000, size = $1000, hotspot = $1FFA, startup = yes;
    BANK1: start = $D000, size = $1000, hotspot = $1FF9, startup = no;
    BANK2: start = $B000, size = $1000, hotspot = $1FF8, startup = no;
}

MEMORY {
    RAM:                  start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph;
    fa_ram:          read_start = $F100, write_start = $F000, size = $0100, type = rw, define = yes;

    bank2:                start = $B200, size = $0D00, type = ro, define = yes, bank = BANK2;
    BANK2_TRAMPOLINE:     start = $BF00, size = $00E0,                         bank = BANK2;
    BANK2_VECTOR_BRIDGE:  start = $BFE0, size = $0012,                         bank = BANK2;
    BANK2_TAIL:           start = $BFF2, size = $0008,                         bank = BANK2;
    BANK2_VECTORS:        start = $BFFA, size = $0006,                         bank = BANK2;

    bank1:                start = $D200, size = $0D00, type = ro, define = yes, bank = BANK1;
    BANK1_TRAMPOLINE:     start = $DF00, size = $00E0,                         bank = BANK1;
    BANK1_VECTOR_BRIDGE:  start = $DFE0, size = $0012,                         bank = BANK1;
    BANK1_TAIL:           start = $DFF2, size = $0008,                         bank = BANK1;
    BANK1_VECTORS:        start = $DFFA, size = $0006,                         bank = BANK1;

    bank0:                start = $F200, size = $0D00, type = ro, define = yes, bank = BANK0;
    BANK0_TRAMPOLINE:     start = $FF00, size = $00E0,                         bank = BANK0;
    BANK0_VECTOR_BRIDGE:  start = $FFE0, size = $0012,                         bank = BANK0;
    BANK0_TAIL:           start = $FFF2, size = $0008,                         bank = BANK0;
    BANK0_VECTORS:        start = $FFFA, size = $0006,                         bank = BANK0;
}

SEGMENTS {
    ZEROPAGE:     load = bank0, run = RAM, type = zp,   define = yes;
    DATA:         load = bank0, run = RAM, type = data, define = yes;
    BSS:          load = RAM,               type = bss,  define = yes;
    STARTUP:      load = bank0,              type = ro,   define = yes;
    CODE:         load = bank0,              type = ro,   define = yes;
    CODE.bank0:   load = bank0,              type = ro,   define = yes;
    CODE.bank1:   load = bank1,              type = ro,   define = yes;
    CODE.bank2:   load = bank2,              type = ro,   define = yes;
    RODATA:       load = bank0,              type = ro,   define = yes;
    RODATA.bank0: load = bank0,              type = ro,   define = yes;
    RODATA.bank1: load = bank1,              type = ro,   define = yes;
    RODATA.bank2: load = bank2,              type = ro,   define = yes;
    VECTORS:      load = BANK0_VECTORS,      type = ro,   start = $FFFA;
}
