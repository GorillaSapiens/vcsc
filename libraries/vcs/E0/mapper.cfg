# Parker Brothers E0 simulator mapping.  Physical/file banks are eight 1K
# chunks.  Power-on selects 4/5/6 into the first three windows; bank 7 is fixed.
CARTRIDGE {
    mapper = E0;
}
BANKS {
    BANK0: start = $1000, size = $0400, fileindex = 0, startup = no;
    BANK1: start = $3400, size = $0400, fileindex = 1, startup = no;
    BANK2: start = $5800, size = $0400, fileindex = 2, startup = no;
    BANK3: start = $7000, size = $0400, fileindex = 3, startup = no;
    BANK4: start = $9000, size = $0400, fileindex = 4, startup = no;
    BANK5: start = $B400, size = $0400, fileindex = 5, startup = no;
    BANK6: start = $D800, size = $0400, fileindex = 6, startup = no;
    BANK7: start = $FC00, size = $0400, fileindex = 7, startup = yes;
}
MEMORY {
    RAM: start = $0080, size = $0080, type = rw, define = yes;
}
