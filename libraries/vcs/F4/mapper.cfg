# Atari 2600 / VCS 32K F4 bank-switched cartridge linker configuration.
#
# VCSC logical BANK0 is the $F000-$FFFF home/startup bank and is written
# last in the cartridge image.  Higher-numbered logical banks descend by
# $2000 and are written first in ascending logical-address order.  Mapper
# hotspots select physical/file chunks in ascending order, so logical BANKn
# uses the opposite selector order from its numeric suffix.
#
# Ordinary ROM allocation stops at offset $F00 in every bank.  The common
# trampoline table occupies $xF00-$xFDF, the identical vector bridge occupies
# $xFE0-$xFF1, $xFF2-$xFF9 remains reserved, and vectors occupy $xFFA-$xFFF.
# F4 hotspots $1FFA/$1FFB overlap the NMI vector bytes; every physical bank
# receives identical vectors, so those selector side effects are deterministic.

CARTRIDGE {
    mapper = F4;
    fillval = $FF;
    trampoline = $0F00;
    trampolinesize = $00E0;
    vectorbridge = $0FE0;
}

BANKS {
    BANK0: start = $F000, size = $1000, hotspot = $1FFB, startup = yes;
    BANK1: start = $D000, size = $1000, hotspot = $1FFA, startup = no;
    BANK2: start = $B000, size = $1000, hotspot = $1FF9, startup = no;
    BANK3: start = $9000, size = $1000, hotspot = $1FF8, startup = no;
    BANK4: start = $7000, size = $1000, hotspot = $1FF7, startup = no;
    BANK5: start = $5000, size = $1000, hotspot = $1FF6, startup = no;
    BANK6: start = $3000, size = $1000, hotspot = $1FF5, startup = no;
    BANK7: start = $1000, size = $1000, hotspot = $1FF4, startup = no;
}

MEMORY {
    RAM:                  start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph;

    bank7:                start = $1000, size = $0F00, type = ro, define = yes, bank = BANK7;
    BANK7_TRAMPOLINE:     start = $1F00, size = $00E0,                         bank = BANK7;
    BANK7_VECTOR_BRIDGE:  start = $1FE0, size = $0012,                         bank = BANK7;
    BANK7_TAIL:           start = $1FF2, size = $0008,                         bank = BANK7;
    BANK7_VECTORS:        start = $1FFA, size = $0006,                         bank = BANK7;

    bank6:                start = $3000, size = $0F00, type = ro, define = yes, bank = BANK6;
    BANK6_TRAMPOLINE:     start = $3F00, size = $00E0,                         bank = BANK6;
    BANK6_VECTOR_BRIDGE:  start = $3FE0, size = $0012,                         bank = BANK6;
    BANK6_TAIL:           start = $3FF2, size = $0008,                         bank = BANK6;
    BANK6_VECTORS:        start = $3FFA, size = $0006,                         bank = BANK6;

    bank5:                start = $5000, size = $0F00, type = ro, define = yes, bank = BANK5;
    BANK5_TRAMPOLINE:     start = $5F00, size = $00E0,                         bank = BANK5;
    BANK5_VECTOR_BRIDGE:  start = $5FE0, size = $0012,                         bank = BANK5;
    BANK5_TAIL:           start = $5FF2, size = $0008,                         bank = BANK5;
    BANK5_VECTORS:        start = $5FFA, size = $0006,                         bank = BANK5;

    bank4:                start = $7000, size = $0F00, type = ro, define = yes, bank = BANK4;
    BANK4_TRAMPOLINE:     start = $7F00, size = $00E0,                         bank = BANK4;
    BANK4_VECTOR_BRIDGE:  start = $7FE0, size = $0012,                         bank = BANK4;
    BANK4_TAIL:           start = $7FF2, size = $0008,                         bank = BANK4;
    BANK4_VECTORS:        start = $7FFA, size = $0006,                         bank = BANK4;

    bank3:                start = $9000, size = $0F00, type = ro, define = yes, bank = BANK3;
    BANK3_TRAMPOLINE:     start = $9F00, size = $00E0,                         bank = BANK3;
    BANK3_VECTOR_BRIDGE:  start = $9FE0, size = $0012,                         bank = BANK3;
    BANK3_TAIL:           start = $9FF2, size = $0008,                         bank = BANK3;
    BANK3_VECTORS:        start = $9FFA, size = $0006,                         bank = BANK3;

    bank2:                start = $B000, size = $0F00, type = ro, define = yes, bank = BANK2;
    BANK2_TRAMPOLINE:     start = $BF00, size = $00E0,                         bank = BANK2;
    BANK2_VECTOR_BRIDGE:  start = $BFE0, size = $0012,                         bank = BANK2;
    BANK2_TAIL:           start = $BFF2, size = $0008,                         bank = BANK2;
    BANK2_VECTORS:        start = $BFFA, size = $0006,                         bank = BANK2;

    bank1:                start = $D000, size = $0F00, type = ro, define = yes, bank = BANK1;
    BANK1_TRAMPOLINE:     start = $DF00, size = $00E0,                         bank = BANK1;
    BANK1_VECTOR_BRIDGE:  start = $DFE0, size = $0012,                         bank = BANK1;
    BANK1_TAIL:           start = $DFF2, size = $0008,                         bank = BANK1;
    BANK1_VECTORS:        start = $DFFA, size = $0006,                         bank = BANK1;

    bank0:                start = $F000, size = $0F00, type = ro, define = yes, bank = BANK0;
    BANK0_TRAMPOLINE:     start = $FF00, size = $00E0,                         bank = BANK0;
    BANK0_VECTOR_BRIDGE:  start = $FFE0, size = $0012,                         bank = BANK0;
    BANK0_TAIL:           start = $FFF2, size = $0008,                         bank = BANK0;
    BANK0_VECTORS:        start = $FFFA, size = $0006,                         bank = BANK0;

}

SEGMENTS {
    ZEROPAGE:     load = bank0, run = RAM, type = zp,   define = yes;
    DATA:         load = bank0, run = RAM, type = data, define = yes;
    BSS:          load = RAM,               type = bss,  define = yes;
    STARTUP:      load = bank0,              type = ro,   define = yes;
    CODE:         load = bank0,              type = ro,   define = yes;
    CODE.bank0:   load = bank0,              type = ro,   define = yes;
    CODE.bank1:   load = bank1,              type = ro,   define = yes;
    CODE.bank2:   load = bank2,              type = ro,   define = yes;
    CODE.bank3:   load = bank3,              type = ro,   define = yes;
    CODE.bank4:   load = bank4,              type = ro,   define = yes;
    CODE.bank5:   load = bank5,              type = ro,   define = yes;
    CODE.bank6:   load = bank6,              type = ro,   define = yes;
    CODE.bank7:   load = bank7,              type = ro,   define = yes;
    RODATA:       load = bank0,              type = ro,   define = yes;
    RODATA.bank0: load = bank0,              type = ro,   define = yes;
    RODATA.bank1: load = bank1,              type = ro,   define = yes;
    RODATA.bank2: load = bank2,              type = ro,   define = yes;
    RODATA.bank3: load = bank3,              type = ro,   define = yes;
    RODATA.bank4: load = bank4,              type = ro,   define = yes;
    RODATA.bank5: load = bank5,              type = ro,   define = yes;
    RODATA.bank6: load = bank6,              type = ro,   define = yes;
    RODATA.bank7: load = bank7,              type = ro,   define = yes;
    VECTORS:      load = BANK0_VECTORS,      type = ro,   start = $FFFA;
}
