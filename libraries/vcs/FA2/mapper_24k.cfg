# Simulator mapping for Harmony FA2 24K (6 x 4K ROM + 256-byte RAM).
# Physical/file bank 0 powers up. Selectors are $1FF5 upward. RAM writes
# at $1000-$10FF and reads at $1100-$11FF. $1FF4 Harmony persistence is
# intentionally not modeled by this core cfg.

CARTRIDGE {
    mapper = FA2;
    fillval = $FF;
    trampoline = $0F00;
    trampolinesize = $00E0;
    vectorbridge = $0FE0;
}

BANKS {
    BANK0: start = $F000, size = $1000, hotspot = $1FF5, fileindex = 0, startup = yes;
    BANK1: start = $D000, size = $1000, hotspot = $1FF6, fileindex = 1, startup = no;
    BANK2: start = $B000, size = $1000, hotspot = $1FF7, fileindex = 2, startup = no;
    BANK3: start = $9000, size = $1000, hotspot = $1FF8, fileindex = 3, startup = no;
    BANK4: start = $7000, size = $1000, hotspot = $1FF9, fileindex = 4, startup = no;
    BANK5: start = $5000, size = $1000, hotspot = $1FFA, fileindex = 5, startup = no;
}

MEMORY {
    RAM:              start = $0080, size = $0080, type = rw, define = yes, callstack = callgraph;
    cartram:      read_start = $F100, write_start = $F000, size = $0100, type = rw, define = yes, read_hazard = yes;
    bank5:            start = $5200, size = $0D00, type = ro, define = yes, bank = BANK5;
    BANK5_TRAMPOLINE: start = $5F00, size = $00E0,                         bank = BANK5;
    BANK5_VECTOR_BRIDGE: start = $5FE0, size = $0012,                     bank = BANK5;
    BANK5_TAIL:       start = $5FF2, size = $0008,                         bank = BANK5;
    BANK5_VECTORS:    start = $5FFA, size = $0006,                         bank = BANK5;
    bank4:            start = $7200, size = $0D00, type = ro, define = yes, bank = BANK4;
    BANK4_TRAMPOLINE: start = $7F00, size = $00E0,                         bank = BANK4;
    BANK4_VECTOR_BRIDGE: start = $7FE0, size = $0012,                     bank = BANK4;
    BANK4_TAIL:       start = $7FF2, size = $0008,                         bank = BANK4;
    BANK4_VECTORS:    start = $7FFA, size = $0006,                         bank = BANK4;
    bank3:            start = $9200, size = $0D00, type = ro, define = yes, bank = BANK3;
    BANK3_TRAMPOLINE: start = $9F00, size = $00E0,                         bank = BANK3;
    BANK3_VECTOR_BRIDGE: start = $9FE0, size = $0012,                     bank = BANK3;
    BANK3_TAIL:       start = $9FF2, size = $0008,                         bank = BANK3;
    BANK3_VECTORS:    start = $9FFA, size = $0006,                         bank = BANK3;
    bank2:            start = $B200, size = $0D00, type = ro, define = yes, bank = BANK2;
    BANK2_TRAMPOLINE: start = $BF00, size = $00E0,                         bank = BANK2;
    BANK2_VECTOR_BRIDGE: start = $BFE0, size = $0012,                     bank = BANK2;
    BANK2_TAIL:       start = $BFF2, size = $0008,                         bank = BANK2;
    BANK2_VECTORS:    start = $BFFA, size = $0006,                         bank = BANK2;
    bank1:            start = $D200, size = $0D00, type = ro, define = yes, bank = BANK1;
    BANK1_TRAMPOLINE: start = $DF00, size = $00E0,                         bank = BANK1;
    BANK1_VECTOR_BRIDGE: start = $DFE0, size = $0012,                     bank = BANK1;
    BANK1_TAIL:       start = $DFF2, size = $0008,                         bank = BANK1;
    BANK1_VECTORS:    start = $DFFA, size = $0006,                         bank = BANK1;
    bank0:            start = $F200, size = $0D00, type = ro, define = yes, bank = BANK0;
    BANK0_TRAMPOLINE: start = $FF00, size = $00E0,                         bank = BANK0;
    BANK0_VECTOR_BRIDGE: start = $FFE0, size = $0012,                     bank = BANK0;
    BANK0_TAIL:       start = $FFF2, size = $0008,                         bank = BANK0;
    BANK0_VECTORS:    start = $FFFA, size = $0006,                         bank = BANK0;
}
