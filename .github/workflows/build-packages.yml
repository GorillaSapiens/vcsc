name: Build binary packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - '*'

permissions:
  contents: write

jobs:
  packages:
    name: Windows and Linux packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            bison \
            flex \
            mingw-w64 \
            pkg-config \
            libpng-dev \
            zip

      - name: Record runner and MinGW toolchain
        shell: bash
        run: |
          set -euxo pipefail
          cat /etc/os-release
          git rev-parse HEAD
          x86_64-w64-mingw32-gcc -v
          readlink -f "$(command -v x86_64-w64-mingw32-gcc)"
          dpkg-query -W '*mingw*'
          printf '#include "host_stdio.h"\n#include <inttypes.h>\n' |
            x86_64-w64-mingw32-gcc -std=c11 -I. -dM -E -x c - |
            grep -E '__MINGW|__USE_MINGW_ANSI_STDIO|__MSVCRT|_UCRT|__GNUC|PRIu64|PRIX64'

      - name: Check MinGW stdio before package compilation
        shell: bash
        run: |
          set -euxo pipefail
          probe="$RUNNER_TEMP/vcsc-mingw-stdio.c"
          cat > "$probe" <<'C'
          #include "host_stdio.h"
          #include <inttypes.h>
          #if !defined(__MINGW32__) || __USE_MINGW_ANSI_STDIO != 1
          #error Expected MinGW C99 stdio
          #endif
          int main(void) {
              size_t n = 171;
              uint64_t wide = UINT64_C(4294967467);
              char text[128];
              if (snprintf(text, sizeof(text), "%zu/%zx/%02zX/%" PRIu64 "/%" PRIX64,
                           n, n, n, wide, wide) < 0) return 1;
              return fprintf(stdout, "%zu/%zx/%02zX/%" PRIu64 "/%" PRIX64 "\n",
                             n, n, n, wide, wide) < 0;
          }
          C
          for mode in 0 1; do
            x86_64-w64-mingw32-gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
              -I "$GITHUB_WORKSPACE" -D__USE_MINGW_ANSI_STDIO="$mode" \
              "$probe" -o "$RUNNER_TEMP/vcsc-mingw-stdio-$mode.exe"
          done

      - name: Build Windows and Linux packages
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make windows
          make clean
          make linux

      - name: Verify standalone RawStream converter
        run: |
          make -C test/rawstream2png
          cd test
          perl test.pl --jobs 8 --e2e-only rawstream2png_contract.pl

      - name: Verify legacy and C99 MinGW stdio modes
        run: |
          cd test
          perl test.pl --jobs 8 --e2e-only host_mingw_stdio.pl

      - name: Name tagged packages after the release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euxo pipefail
          windows=(vcsc.windows.*.zip)
          linux=(vcsc.linux.*.tar.gz)
          test "${#windows[@]}" -eq 1
          test "${#linux[@]}" -eq 1
          test -f "${windows[0]}"
          test -f "${linux[0]}"
          mv -- "${windows[0]}" "vcsc.windows.${GITHUB_REF_NAME}.zip"
          mv -- "${linux[0]}" "vcsc.linux.${GITHUB_REF_NAME}.tar.gz"

      - name: Show packages
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh vcsc.windows.*.zip vcsc.linux.*.tar.gz

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: vcsc-windows-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: vcsc.windows.*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: vcsc-linux-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: vcsc.linux.*.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Publish tagged packages to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes --title "$tag"
          fi
          gh release upload "$tag" \
            "vcsc.windows.${tag}.zip" \
            "vcsc.linux.${tag}.tar.gz" \
            --clobber
