MEMORY {
    ZEROPAGE: start = $0000, size = $0100, type = rw, define = yes;
    CPUSTACK: start = $0100, size = $0100, type = rw, define = yes;
    BASKET:   start = $0200, size = $0010, type = rw, define = yes;
    CRATE:    start = $0210, size = $0010, type = rw, define = yes;
    RAM:      start = $0220, size = $0DE0, type = rw, define = yes;
    ORCHARD:  start = $D000, size = $0800, type = ro, define = yes;
    GROVE:    start = $D800, size = $0800, type = ro, define = yes;
    ROM:      start = $E000, size = $2000, type = ro, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ROM, run = ZEROPAGE, type = zp, define = yes;
    CODE:     load = ROM,                 type = ro, define = yes;
    RODATA:   load = ROM,                 type = ro, define = yes;
    BSS:      load = RAM,                 type = bss, define = yes;
    DATA:     load = ROM, run = RAM,      type = data, define = yes;
}
