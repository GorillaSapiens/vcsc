# Generic 6502 layout used by vcs_scalar_operator_cartesian.pl.
# The split `cartram` aliases deliberately live outside ordinary RAM and ROM so
# every generated cell exercises separate read/write addresses without a mapper.
MEMORY {
    ZEROPAGE: start = $0000, size = $0100, type = rw, define = yes;
    CPUSTACK: start = $0100, size = $0100, type = rw, define = yes;
    RAM:      start = $0200, size = $1E00, type = rw, define = yes;
    cartram:  read_start = $F080, write_start = $F000, size = $0080, type = rw, define = yes;
    ROM:      start = $4000, size = $B000, type = ro, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ROM, run = ZEROPAGE, type = zp,   define = yes;
    CODE:     load = ROM,                 type = ro,   define = yes;
    RODATA:   load = ROM,                 type = ro,   define = yes;
    BSS:      load = RAM,                 type = bss,  define = yes;
    DATA:     load = ROM, run = RAM,      type = data, define = yes;
}
